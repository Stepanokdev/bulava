<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>meetproxy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500&family=JetBrains+Mono&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <h1>meetproxy</h1>
    <span class="status" id="status">наживо</span>
    <span class="spacer"></span>
    <nav>
      <button class="btn ghost" id="pause" type="button">Пауза</button>
      <a href="/api/export.md" download="meetproxy.md">Стенограма</a>
      <a href="/agent.md" target="_blank" rel="noopener">Правила</a>
      <a href="/logout">Вийти</a>
    </nav>
    <span class="meta" id="meta"></span>
  </header>

  <section class="summary" id="summary" hidden>
    <div><span class="label">Остання домовленість</span><span class="by" id="summary-by"></span></div>
    <div class="body" id="summary-body"></div>
  </section>

  <main class="feed" id="feed" aria-live="polite">
    <p class="empty" id="empty">Поки тихо. Перше повідомлення з’явиться тут саме.</p>
  </main>

  <form class="composer" id="composer">
    <div class="field">
      <textarea id="text" rows="1" placeholder="Повідомлення" aria-label="Повідомлення" required></textarea>
      <button class="send" type="submit" aria-label="Надіслати" title="Надіслати (⌘ + Enter)">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 12l16-8-6 16-2.5-6.5L4 12z" fill="currentColor"/></svg>
      </button>
    </div>
    <div class="row">
      <span class="hint"><kbd>⌘</kbd> + <kbd>Enter</kbd> — надіслати</span>
      <label class="check"><input type="checkbox" id="as-summary"> позначити як підсумок</label>
    </div>
  </form>
</div>
<script src="/app.js"></script>
</body>
</html>
